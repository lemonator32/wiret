# Publishes the web version of the Wiret editor (TypeScript) to GitHub Pages.
#
# Every push to main runs the app's tests (which check that the app gives the same results
# as the Python prototype did), builds the static site (dist/) and deploys it. Pull requests
# into main run the same tests and build, without deploying, so a broken site is caught
# before it is merged.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but a running one finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install the app's dependencies
        run: npm ci

      - name: Test the bytecode runtime (Rust)
        run: cargo test --manifest-path runtime/Cargo.toml

      - name: Run the app's tests
        run: npm test

      - name: Build the site
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
