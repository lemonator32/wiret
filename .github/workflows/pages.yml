# Publishes the web version of the Wiret editor (app/, TypeScript) to GitHub Pages.
#
# Every push to main runs the Python prototype's tests and the TypeScript app's tests (which
# check that the app gives the same results as the prototype), builds the static site
# (app/dist) and deploys it. Pull requests into main run the same tests and build, without
# deploying, so a broken site is caught before it is merged.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but a running one finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the prototype's tests
        working-directory: prototype
        run: python -m unittest discover tests

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Run the app's tests
        working-directory: app
        run: npm test

      - name: Build the site
        working-directory: app
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
